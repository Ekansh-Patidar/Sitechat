# Lint: pyflakes (unused or undefined names), the most serious pycodestyle
# errors, and bugbear (likely bugs). Not a formatter; style is left alone.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "B008",  # Depends(...) in argument defaults is how FastAPI works
    "B905",  # zip(strict=...): the lists zipped here are built to match
]

[lint.per-file-ignores]
# Tests import late on purpose (after a skip check, or next to the tests
# that need it).
"tests/**" = ["E402"]
"scripts/test_eval_metrics.py" = ["E402"]
